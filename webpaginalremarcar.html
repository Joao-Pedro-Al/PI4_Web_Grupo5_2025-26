      <div class="col-2 ms-5 p-4 " style="border:1.5px solid #A99C5E; background-color: white; border-radius:30px;">
        
        <label class="section-title text-center w-100" style="color: #A99C5E; font-size: 12px;">Hora Início</label>

          <a href="#" class="btn btn-link p-0" style=" font-size: 14px;">OK</a>
        </div>
      </div>

        <div class="d-flex justify-content-center align-items-center gap-3 mb-2">
          <input type="number" id="hourEnd" class="time-box" min="0" max="23" value="15">
          <span style="font-size:2rem;font-weight:bold;">:</span>
          <input type="number" id="minuteEnd" class="time-box" min="0" max="59" value="00">

   <div class="linha-final">
      <textarea class="form-control" rows="5" style="max-width: 970px;border:1.5px solid #A99C5E;border-radius:10px"></textarea> 
      
         <button type="submit" class="btn"  style=" max-width: 970px;width: 200px; height: 55px; border-radius:10px; font-size: 25px;">Confirmar</button>
    </div>
    </div>
    <!-- CONFIRMAR -->

<script>
  document.getElementById('confirmBtn').addEventListener('click', () => {
    let h1 = parseInt(document.getElementById('hourStart').value);
    let m1 = parseInt(document.getElementById('minuteStart').value);
    let h2 = parseInt(document.getElementById('hourEnd').value);
    let m2 = parseInt(document.getElementById('minuteEnd').value);

    if(h2 < h1 || (h2 === h1 && m2 <= m1)) {
      alert("A hora fim deve ser maior que a hora início.");
      return;
    }

    alert(`Horário confirmado:\nInício: ${h1.toString().padStart(2,'0')}:${m1.toString().padStart(2,'0')}\nFim: ${h2.toString().padStart(2,'0')}:${m2.toString().padStart(2,'0')}`);
  });
</script>
