<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta Atual</title>

  <link rel="stylesheet" type="text/css" href="style.css">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>

  <!-- Barra dourada -->
  <div class="header-bar">
    <i class="bi bi-person-circle"></i>
    <i class="bi bi-bell"></i>
  </div>

  <div class="layout">

    <!-- MENU LATERAL -->
    <nav class="menu menu--vertical">
      <div class="menu__logo">
        <img src="../imagens/logo.png" alt="Logo" class="menu__logo-img">
      </div>
      <ul class="menu__list">
        <li class="menu__item"><a class="menu__link" href="#"><i class="bi bi-house-door-fill"></i> Início</a></li>
        <li class="menu__item"><a class="menu__link" href="#"><i class="bi bi-calendar-week"></i> Remarcar</a></li>
        <li class="menu__item"><a class="menu__link" href="#"><i class="bi bi-plus-circle"></i> Criar Conta</a></li>
        <li class="menu__item"><a class="menu__link" href="#"><i class="bi bi-bell-fill"></i> Notificações</a></li>
        <li class="menu__item"><a class="menu__link" href="#"><i class="bi bi-person-circle"></i> Perfis</a></li>
        <li class="menu__item">
          <a class="menu__link btn-gold" href="#"><i class="bi bi-journal-medical"></i> Consultas</a>
        </li>
        <li class="menu__item"><a class="menu__link" href="#"><i class="bi bi-box-arrow-right"></i> Sign Out</a></li>
      </ul>
    </nav>

    <!-- CONTEÚDO -->
    <div class="content">

      <h4 class="section-title">Consulta Atual</h4>

      <div class="row g-4">

        <!-- COLUNA ESQUERDA -->
        <div class="card p-4 mb-4">
  <h5>Informação da Consulta</h5>

  <form action="/guardar-consulta" method="POST">

    <label class="form-label">Tipo de Consulta</label>
    <input type="text" name="tipo_consulta" class="form-control mb-3">

    <label class="form-label">Médico Responsável</label>
    <input type="text" name="medico" class="form-control mb-3">

    <label class="form-label">Descrição</label>
    <textarea name="descricao" class="form-control" rows="3"></textarea>

    <button type="submit" class="btn btn-gold mt-3">
      Guardar Consulta
    </button>

  </form>
</div>

</div>


          <div class="card p-4">
            <h5>Paciente na Consulta</h5>

            <label class="form-label">Nome</label>
            <input type="text" class="form-control mb-3">

            <label class="form-label">Género</label>
            <input type="text" class="form-control mb-3">

            <label class="form-label">Condições de Saúde</label>
            <textarea class="form-control mb-3"></textarea>

            <label class="form-label">Alergias</label>
            <textarea class="form-control"></textarea>
          </div>

        </div>

        <!-- COLUNA DIREITA -->
        <div class="col-lg-6">

          <div class="card p-4 mb-4">
            <h5>Adicionar Informação</h5>

            <label class="form-label">Apontamentos da Consulta</label>
            <textarea class="form-control mb-3"></textarea>

            <label class="form-label">Complicações</label>
            <textarea class="form-control mb-3"></textarea>

            <label class="form-label">Satisfação</label>
            <select class="form-select mb-3">
              <option>Excelente</option>
              <option>Boa</option>
              <option>Razoável</option>
              <option>Má</option>
            </select>

            <label class="form-label">Anexar Comprovativo de Presença</label>
            <input type="file" class="form-control">
          </div>

          <div class="card p-4">
            <h5>Adicionar Plano de Tratamento</h5>

            <label class="form-label">Nome</label>
            <input type="text" class="form-control mb-3">

            <label class="form-label">1º Tratamento</label>
            <input type="text" class="form-control mb-3">

            <label class="form-label">2º Tratamento</label>
            <input type="text" class="form-control mb-4">

            <button class="btn btn-gold w-100">
              Criar Plano de Tratamento
            </button>
          </div>

        </div>

      </div>

    </div><!-- content -->

  </div><!-- layout -->

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">

    async function carregarDetalhes() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  const res = await fetch("/consultas/" + id);
  const c = await res.json();

  document.getElementById("nome").value = c.nome_paciente || "";
  document.getElementById("telefone").value = c.telefone || "";
  document.getElementById("email").value = c.email || "";
  document.getElementById("tipo").value = c.tipo_consulta || "";
  document.getElementById("medico").value = c.medico || "";
  document.getElementById("data").value = c.data || "";
  document.getElementById("hora").value = c.hora || "";
}

carregarDetalhes();
  </script>

</body>
</html>
