<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8">
    <meta
      name="description"
      content="Projeto Integrado 4">
    <meta name="keywords" content="landingpage, section, forms, navs" >
    <meta name="author" content="Grupo">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta</title>
    <link rel="stylesheet" type="text/css" href="style.css"> 
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
   integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" 
  integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  </head>

  <body>
    <div class="header-bar">
  <i class="bi bi-person-circle"></i>
  <i class="bi bi-bell"></i>
</div> <!-- bara dourada -->

  <div class="layout">
    <!--menu do lado-->
    <nav class="menu menu--vertical">
      <div class="menu__logo">
        <img src="imagens/logo.png" alt="Logo" class="menu__logo-img">
      </div>
      <ul class="menu__list">
        <li class="menu__item">
          <a class="menu__link" href="#">
            <i class="bi bi-house-door-fill"></i> Início
          </a>
        </li>
        <li class="menu__item">
          <a class="menu__link" href="#">
            <i class="bi bi-calendar-week"></i> Remarcar
          </a>
        </li>
        <li class="menu__item">
    <a class="menu__link btn-gold" href="#">
      <i class="bi bi-plus-circle"></i> Criar Conta
    </a>
  </li>

        <li class="menu__item">
          <a class="menu__link" href="#">
            <i class="bi bi-bell-fill"></i> Notificações
          </a>
        </li>
        <li class="menu__item">
          <a class="menu__link" href="#">
            <i class="bi bi-person-circle"></i> Perfis
          </a>
        </li>
        <li class="menu__item">
          <a class="menu__link" href="#">
            <i class="bi bi-journal-medical"></i> Consultas
          </a>
        </li>
        <li class="menu__item">
          <a class="menu__link" href="#">
            <i class="bi bi-box-arrow-right"></i> Sign Out
          </a>
        </li>
      </ul>
    </nav>

    <!-- Content -->
    <div class="content">
      <div class="form-container">
        
        <form>
          <div class="left-column">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter Username">

          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter Email">
          </div>

          <div class="right-column">
          <label>Tipo de Conta</label>
          <div class="custom-select" data-name="account_type">
            <div class="custom-select__selected">Paciente</div>
            <div class="custom-select__options">
            <div data-value="paciente">Paciente</div>
            <div data-value="medico">Médico</div>
           </div>
          </div>
          <input type="hidden" name="account_type" value="paciente">

          <label>Perfil de Paciente</label>
          <div class="custom-select" data-name="profile">
           <div class="custom-select__selected">Geral</div>
           <div class="custom-select__options">
            <div data-value="geral">Geral</div>
           <div data-value="especifico">Específico</div>
          </div>
         </div>
        <input type="hidden" name="profile" value="geral">
          <button type="submit" class="btn">Associar</button>
           
          </div>
        </form>
      </div>
    </div>
  </div>
  <script>
document.querySelectorAll('.custom-select').forEach(select => {
  const selected = select.querySelector('.custom-select__selected');
  const options = select.querySelector('.custom-select__options');
  const input = select.nextElementSibling;

  selected.addEventListener('click', () => {
    options.style.display =
      options.style.display === 'block' ? 'none' : 'block';
  });

  options.querySelectorAll('div').forEach(option => {
    option.addEventListener('click', () => {
      selected.textContent = option.textContent;
      input.value = option.dataset.value;
      options.style.display = 'none';
    });
  });
});

document.addEventListener('click', e => {
  document.querySelectorAll('.custom-select__options').forEach(o => {
    if (!o.parentElement.contains(e.target)) o.style.display = 'none';
  });
});
</script>

</body>
